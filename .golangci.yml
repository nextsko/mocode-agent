version: "2"
linters:
  enable:
    - bodyclose
    - exhaustive
    - goconst
    - godot
    - godox
    - goprintffuncname
    - gosec
    - misspell
    - nakedret
    - nestif
    - nilerr
    - noctx
    - nolintlint
    - prealloc
    - revive
    - rowserrcheck
    - sqlclosecheck
    - staticcheck
    - tparallel
    - unconvert
    - unparam
    - whitespace
    - wrapcheck
  disable:
    - ineffassign
    - unused
  settings:
    errcheck:
      # New code is gated on unchecked errors; the existing backlog stays visible
      # in the scheduled full report but does not block merges.
      check-type-assertions: false
      check-blank: false
      # Writing to stdout/stderr and closing is not actionable at call sites.
      exclude-functions:
        - (io.Closer).Close
        - (*os.File).Close
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - fmt.Print
        - fmt.Printf
        - fmt.Println
    gosec:
      # G104 (unhandled errors) duplicates errcheck, which now gates all new
      # code; keeping both makes the full report double-count the same lines.
      excludes:
        - G104
    exhaustive:
      # A switch with a default branch covers unknown enum values by design;
      # treating that as exhaustive removes noise without hiding real gaps.
      default-signifies-exhaustive: true
    revive:
      rules:
        # `exported` (comment/naming on every exported symbol) and
        # `unused-parameter` fire on ~1,150 intentionally shaped signatures in
        # this codebase. Keeping them enabled drowns the linter in style noise
        # while the genuinely useful revive rules stay on.
        - name: exported
          disabled: true
        - name: unused-parameter
          disabled: true
    wrapcheck:
      # Stdlib filesystem/encoding calls are wrapped by the caller when the
      # extra context matters; requiring a wrap at every return adds churn
      # without adding handling. Only third-party errors keep the rule.
      extra-ignore-sigs:
        - "func os.MkdirAll("
        - "func os.ReadFile("
        - "func os.WriteFile("
        - "func os.Open("
        - "func os.Rename("
        - "func os.ReadDir("
        - "func io.ReadAll("
        - "func encoding/json.Unmarshal("
        - "func encoding/json.MarshalIndent("
        - "func fmt.Fprint("
        - "func fmt.Fprintf("
      # The safety signal is an unwrapped error from a THIRD-PARTY package.
      # Errors from this module (and from well-known libraries whose errors are
      # wrapped where context matters) are frequently returned as-is; flagging
      # every return adds churn without adding error-handling safety.
      ignore-package-globs:
        - github.com/nextsko/mocode-agent/*
        - golang.org/x/sync/*
        - charm.land/*
        - github.com/charmbracelet/*
    goconst:
      # Three-letter repeats ("bash", "tool", "enabled") in one file are not
      # worth a constant; five or more in the same package are.
      min-occurrences: 5
      # JSON-schema vocabulary and the property names every tool schema shares
      # are declarative wire format, not duplicated domain strings. Hand-written
      # port schemas repeat them by design.
      ignore-string-values:
        - '^(type|description|properties|required|items|array|object|string|integer|boolean|number|file_path|url|host|shell_id)$'
  exclusions:
    generated: lax
    presets:
      - common-false-positives
    rules:
      - text: '(slog|log)\.\w+'
        linters:
          - noctx
      # 测试文件放宽某些规则
      - path: '_test\.go'
        linters:
          - gosec
          - wrapcheck
          - godot
          - goconst
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gofumpt
    - goimports
  exclusions:
    generated: lax
